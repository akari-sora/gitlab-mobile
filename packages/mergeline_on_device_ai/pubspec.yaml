name: mergeline_on_device_ai
description: Android on-device AI (ML Kit GenAI Prompt / Gemini Nano) plugin for Mergeline.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.gitlabmobile.on_device_ai
        pluginClass: MergelineOnDeviceAiPlugin
