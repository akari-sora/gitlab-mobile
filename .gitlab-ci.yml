workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

stages: [verify, build, deliver]

variables:
  DEBIAN_FRONTEND: noninteractive
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

default:
  image: python:3.13-slim
  tags: [saas-linux-small-amd64]
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

.flutter:
  cache:
    - key: flutter-linux-3.47.2
      paths: [.ci-cache/]
      policy: pull-push
    - key: pub-linux-3.47.2
      paths: [.pub-cache/]
      policy: pull-push
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git curl xz-utils unzip libglu1-mesa ca-certificates
    - source ci/install_flutter.sh

python_checks:
  stage: verify
  timeout: 5m
  script:
    - python3 -m unittest discover -s ci/tests -p '*_test.py' -v
    - python3 -m unittest discover -s tool/tests -p test_bootstrap.py -v
    - python3 -m compileall -q ci tool
    - for script in ci/*.sh; do bash -n "$script"; done

flutter_checks:
  extends: .flutter
  stage: verify
  timeout: 15m
  coverage: '/Coverage: (\d+(?:\.\d+)?)%/'
  script:
    - bash ci/check.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ci-output/, coverage/]
    reports:
      junit: ci-output/junit.xml

native_templates:
  extends: .flutter
  stage: verify
  timeout: 15m
  script:
    - if [ -d android ] && [ -d ios ]; then python3 tool/bootstrap.py --check-sdk; else python3 tool/bootstrap.py; fi
    - mkdir -p ci-output
    - tar --exclude=local.properties --exclude=Generated.xcconfig --exclude=flutter_export_environment.sh -czf ci-output/native-templates.tar.gz android ios .metadata
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ci-output/native-templates.tar.gz]

android_debug:
  extends: .flutter
  stage: build
  timeout: 40m
  needs:
    - job: python_checks
      artifacts: false
    - job: flutter_checks
      artifacts: true
    - job: native_templates
      artifacts: true
  cache:
    - key: flutter-linux-3.47.2
      paths: [.ci-cache/]
      policy: pull
    - key: pub-linux-3.47.2
      paths: [.pub-cache/]
      policy: pull
    - key: android-linux-15859902-flutter-3.47.2
      paths: [.android-sdk/, .gradle-user/]
      policy: pull-push
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends openjdk-21-jdk-headless
    - source ci/install_android.sh
    - bash ci/build_android.sh
  artifacts:
    expire_in: 14 days
    paths: [artifacts/]
    expose_as: Android development APK

publish_preview:
  stage: deliver
  needs:
    - job: android_debug
      artifacts: true
  timeout: 10m
  interruptible: false
  resource_group: preview-delivery
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
  script:
    - bash ci/deliver_preview.sh
