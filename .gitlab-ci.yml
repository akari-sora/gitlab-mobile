workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
stages: [verify, build, deliver]
variables:
  DEBIAN_FRONTEND: noninteractive
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
default:
  image: python:3.13-slim
  tags: [grok-box, ondemand, gitlab-mobile]
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]
.regular:
  rules:
    - if: '$LIVE_SMOKE == "1" || $RESOLVE_LOCK == "1" || $PUBLIC_SMOKE == "1" || $GH2GL_SYNC == "1"'
      when: never
    - when: on_success
.flutter:
  cache:
    - key: flutter-linux-3.47.2
      paths: [.ci-cache/]
      policy: pull-push
    - key: pub-linux-3.47.2
      paths: [.pub-cache/]
      policy: pull-push
  before_script:
    # SDK archives contain UIDs outside the rootless container's mapping.
    - export TAR_OPTIONS="${TAR_OPTIONS:+$TAR_OPTIONS }--no-same-owner"
    - python3 ci/install_packages.py git curl xz-utils unzip libglu1-mesa ca-certificates
    - source ci/install_flutter.sh
resolve_lock:
  extends: .flutter
  stage: verify
  timeout: 15m
  rules:
    - if: '$RESOLVE_LOCK == "1" && $CI_PIPELINE_SOURCE == "api"'
  script:
    - flutter pub get
    - echo BEGIN_DEPENDENCY_LOCK
    - cat pubspec.lock
    - echo END_DEPENDENCY_LOCK
  artifacts:
    expire_in: 1 day
    paths: [pubspec.lock]
python_checks:
  extends: .regular
  stage: verify
  timeout: 5m
  before_script:
    - python3 ci/install_packages.py git openssl
  script:
    - python3 -m unittest discover -s ci/tests -p '*_test.py' -v
    - python3 -m unittest discover -s tool/tests -p 'test_*.py' -v
    - python3 -m compileall -q ci tool
    - for script in ci/*.sh; do bash -n "$script"; done
flutter_checks:
  extends: [.flutter, .regular]
  stage: verify
  timeout: 15m
  coverage: '/Coverage: (\d+(?:\.\d+)?)%/'
  script:
    - bash ci/check.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ci-output/, coverage/]
    reports:
      junit: ci-output/junit.xml
native_templates:
  extends: [.flutter, .regular]
  stage: verify
  timeout: 15m
  script:
    - if [ -d android ] && [ -d ios ]; then python3 tool/bootstrap.py --check-sdk; else python3 tool/bootstrap.py; fi
    - mkdir -p ci-output
    - tar --exclude=local.properties --exclude=Generated.xcconfig --exclude=flutter_export_environment.sh -czf ci-output/native-templates.tar.gz android ios .metadata
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ci-output/native-templates.tar.gz]
android_debug:
  extends: [.flutter, .regular]
  stage: build
  timeout: 40m
  needs:
    - job: python_checks
      artifacts: false
    - job: flutter_checks
      artifacts: true
    - job: native_templates
      artifacts: true
  cache:
    - key: flutter-linux-3.47.2
      paths: [.ci-cache/]
      policy: pull
    - key: pub-linux-3.47.2
      paths: [.pub-cache/]
      policy: pull
    - key: android-linux-15859902-flutter-3.47.2
      paths: [.android-sdk/, .gradle-user/]
      policy: pull-push
  script:
    - python3 ci/install_packages.py openjdk-21-jdk-headless
    - source ci/install_android.sh
    - bash ci/build_android.sh
  variables:
    GITLAB_MOBILE_ALLOW_EPHEMERAL_DEBUG_SIGNING: '1'
  artifacts:
    expire_in: 14 days
    paths: [artifacts/]
    expose_as: Android development APK
publish_preview:
  stage: deliver
  needs:
    - job: android_debug
      artifacts: true
  timeout: 10m
  interruptible: false
  resource_group: preview-delivery
  rules:
    - if: '$LIVE_SMOKE == "1" || $RESOLVE_LOCK == "1" || $PUBLIC_SMOKE == "1" || $GH2GL_SYNC == "1"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - python3 ci/install_packages.py curl ca-certificates
  script:
    - bash ci/deliver_preview.sh
live_crud_smoke:
  extends: .flutter
  stage: verify
  timeout: 20m
  interruptible: false
  retry: 0
  resource_group: isolated-live-smoke
  rules:
    - if: '$LIVE_SMOKE == "1" && $RESOLVE_LOCK != "1" && $PUBLIC_SMOKE != "1" && $CI_PIPELINE_SOURCE == "api"'
  cache: []
  script:
    - flutter pub get --enforce-lockfile
    - dart run tool/live_smoke.dart
  artifacts:
    when: always
    expire_in: 1 day
    paths: [smoke-output/report.json]
public_api_smoke:
  extends: .flutter
  stage: verify
  timeout: 10m
  rules:
    - if: '$LIVE_SMOKE == "1" || $RESOLVE_LOCK == "1" || $GH2GL_SYNC == "1"'
      when: never
    # Anonymous reads share gitlab.com's per-IP budget with every job on the runner host, so the
    # suite runs on its schedule or on demand, never on pushes. See docs/CI.md "Public API smoke".
    - if: '$PUBLIC_SMOKE == "1" && $CI_PIPELINE_SOURCE =~ /^(api|schedule|web)$/'
  script:
    - flutter pub get --enforce-lockfile
    - dart run tool/public_smoke.dart
  artifacts:
    when: always
    expire_in: 14 days
    paths: [public-smoke-output/report.json]
gh2gl_sync:
  # Scheduled only: brings branches pushed to the GitHub mirror (cloud Claude, claude/*) back here.
  # See docs/CI.md "GitHub branch sync". Other jobs are skipped when GH2GL_SYNC is 1.
  stage: verify
  timeout: 10m
  interruptible: false
  retry: 0
  resource_group: gh2gl-sync
  environment:
    name: gh2gl-sync
    action: access
  cache: []
  variables:
    GH2GL_GITHUB: akari-sora/gitlab-mobile
    GH2GL_PATTERNS: claude/*
  rules:
    - if: '$GH2GL_SYNC == "1" && $CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - python3 ci/install_packages.py git openssh-client ca-certificates
  script:
    - bash ci/gh2gl_sync.sh
