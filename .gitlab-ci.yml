workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

stages: [verify]

sdk_preflight:
  image: python:3.13-slim
  tags: [saas-linux-small-amd64]
  stage: verify
  timeout: 15m
  interruptible: true
  cache:
    key: flutter-linux-3.47.2
    paths: [.ci-cache/]
    policy: pull-push
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git curl xz-utils unzip libglu1-mesa ca-certificates
  script:
    - bash ci/install_flutter.sh
