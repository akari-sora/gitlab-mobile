workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

stages: [verify]

runner_preflight:
  image: python:3.13-slim
  tags: [saas-linux-small-amd64]
  stage: verify
  timeout: 5m
  interruptible: true
  script:
    - python --version
    - python -c 'import urllib.request; r = urllib.request.urlopen("https://storage.googleapis.com/flutter_infra_release/flutter/releases/releases_linux.json", timeout=30); print("Flutter release manifest HTTP", r.status)'
