workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

stages: [verify, build, deliver]

default:
  image: python:3.13-slim
  tags: [saas-linux-small-amd64]
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

.flutter:
  cache:
    - key: flutter-linux-3.47.2
      paths: [.ci-cache/]
      policy: pull-push
    - key: pub-linux-3.47.2
      paths: [.pub-cache/]
      policy: pull-push
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git curl xz-utils unzip libglu1-mesa ca-certificates
    - source ci/install_flutter.sh

flutter_checks:
  extends: .flutter
  stage: verify
  timeout: 20m
  script:
    - bash ci/check.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ci-output/, coverage/]
    reports:
      junit: ci-output/junit.xml

native_templates:
  extends: .flutter
  stage: verify
  timeout: 15m
  script:
    - python3 tool/bootstrap.py
    - mkdir -p ci-output
    - tar --exclude=local.properties --exclude=Generated.xcconfig --exclude=flutter_export_environment.sh -czf ci-output/native-templates.tar.gz android ios .metadata
  artifacts:
    when: always
    expire_in: 14 days
    paths: [ci-output/]
