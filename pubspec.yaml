name: gitlab_mobile
description: Mobile-first GitLab collaboration client for Android and iOS.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: 5.11.1
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  go_router: 16.3.0
  url_launcher: 6.3.2
  flutter_markdown_plus: 1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
